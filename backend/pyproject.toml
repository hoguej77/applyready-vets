[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "applyready-vets-api"
version = "0.7.0"
description = "Evidence-backed veteran career and resume service for ApplyReady Vets"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.139,<0.140",
  "uvicorn[standard]>=0.51,<0.52",
  "pydantic>=2.13,<3",
  "python-multipart>=0.0.32,<0.1",
  "openai>=2.45,<3",
  "python-docx>=1.2,<2",
  "pypdf>=6.14,<7",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<0.29", "pytest>=9.1,<10", "ruff>=0.15,<0.16"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["providers/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
